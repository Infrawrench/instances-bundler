name: publish-script

# The steps every platform's publish job runs; publish.yml calls this once per platform.
on:
  workflow_call:
    inputs:
      script:
        description: The publish-<platform>.sh script to run
        required: true
        type: string
      reseed:
        description: Build the bundle from scratch instead of updating the published one
        required: false
        type: boolean
        default: false
      go-module:
        description: Directory of the Go module the update script builds, for its Go version
        required: false
        type: string
        default: aws
      gcp-auth:
        description: >-
          Get a GCP access token for the update script, through workload identity federation. The calling job
          must grant id-token: write.
        required: false
        type: boolean
        default: false

# No permissions block: this workflow gets its caller's, so only the job that grants id-token: write can
# get a GCP token.

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-module }}/go.mod
          cache: false

      - name: Install the AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o "$RUNNER_TEMP/awscli.zip"
            unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install"
          fi
          aws --version
          for cmd in jq xz shasum; do command -v "$cmd"; done

      # Only this repository's main-branch publish runs can use the provider (see the README), and the service
      # account can only read prices and list machine types.
      - name: Authenticate to Google Cloud
        if: inputs.gcp-auth
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Publish
        run: ./${{ inputs.script }}
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TMPDIR: ${{ runner.temp }}
          RESEED: ${{ inputs.reseed && '1' || '' }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GCP_PROJECT: ${{ inputs.gcp-auth && vars.GCP_PROJECT || '' }}
