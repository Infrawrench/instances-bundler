name: publish

# Each platform has its own cron and job. A scheduled run only knows which cron string started it,
# so every cron string must be unique, and each job's `if` must repeat its platform's string exactly.
on:
  schedule:
    # EC2 every 5 minutes, the shortest interval GitHub allows. Runs can start late, or be skipped, under load.
    - cron: "*/5 * * * *"
    # The other platforms every 15 minutes, each at its own offset.
    - cron: "1,16,31,46 * * * *" # rds
    - cron: "2,17,32,47 * * * *" # elasticache
    - cron: "3,18,33,48 * * * *" # opensearch
    - cron: "4,19,34,49 * * * *" # redshift
    - cron: "6,21,36,51 * * * *" # docdb
    - cron: "7,22,37,52 * * * *" # neptune
    - cron: "8,23,38,53 * * * *" # memorydb
    - cron: "9,24,39,54 * * * *" # dax
    - cron: "11,26,41,56 * * * *" # sagemaker
    - cron: "12,27,42,57 * * * *" # emr
    - cron: "13,28,43,58 * * * *" # gamelift
    # Spot every 6 hours: its prices change hourly, and each change uploads the whole bundle again.
    - cron: "14 */6 * * *" # spot
    # RunPod every 30 minutes. Its API only has current prices; a run that sees no change uploads nothing.
    - cron: "10,40 * * * *" # runpod
    # Alibaba every 6 hours. It publishes a price version every few days, and every version stays published.
    - cron: "29 */6 * * *" # alibaba

permissions:
  contents: read

# Only one publish per platform at a time. A run triggered while one is going waits instead of cancelling it,
# and GitHub keeps at most one waiting run per group, so the queue never builds up.
jobs:
  ec2:
    if: github.event.schedule == '*/5 * * * *'
    concurrency:
      group: publish-ec2
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-ec2.sh
    secrets: inherit

  rds:
    if: github.event.schedule == '1,16,31,46 * * * *'
    concurrency:
      group: publish-rds
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-rds.sh
    secrets: inherit

  elasticache:
    if: github.event.schedule == '2,17,32,47 * * * *'
    concurrency:
      group: publish-elasticache
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-elasticache.sh
    secrets: inherit

  opensearch:
    if: github.event.schedule == '3,18,33,48 * * * *'
    concurrency:
      group: publish-opensearch
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-opensearch.sh
    secrets: inherit

  redshift:
    if: github.event.schedule == '4,19,34,49 * * * *'
    concurrency:
      group: publish-redshift
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-redshift.sh
    secrets: inherit

  docdb:
    if: github.event.schedule == '6,21,36,51 * * * *'
    concurrency:
      group: publish-docdb
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-docdb.sh
