    concurrency:
      group: publish-neptune
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-neptune.sh
    secrets: inherit

  memorydb:
    if: github.event.schedule == '8,23,38,53 * * * *'
    concurrency:
      group: publish-memorydb
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-memorydb.sh
    secrets: inherit

  dax:
    if: github.event.schedule == '9,24,39,54 * * * *'
    concurrency:
      group: publish-dax
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-dax.sh
    secrets: inherit

  sagemaker:
    if: github.event.schedule == '11,26,41,56 * * * *'
    concurrency:
      group: publish-sagemaker
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-sagemaker.sh
    secrets: inherit

  emr:
    if: github.event.schedule == '12,27,42,57 * * * *'
    concurrency:
      group: publish-emr
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-emr.sh
    secrets: inherit

  gamelift:
    if: github.event.schedule == '13,28,43,58 * * * *'
    concurrency:
      group: publish-gamelift
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
