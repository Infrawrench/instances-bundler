name: publish

# Each platform has its own cron and job. A scheduled run only knows which cron string started it,
# so every cron string must be unique, and each job's `if` must repeat its platform's string exactly.
on:
  workflow_dispatch:

permissions:
  contents: read

# Only one publish per platform at a time. A run triggered while one is going waits instead of cancelling it,
# and GitHub keeps at most one waiting run per group, so the queue never builds up.
jobs:
  rds:
    concurrency:
      group: publish-rds
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-rds.sh
      reseed: true
    secrets: inherit

  neptune:
    concurrency:
      group: publish-neptune
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-neptune.sh
      reseed: true
    secrets: inherit

  sagemaker:
    concurrency:
      group: publish-sagemaker
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-sagemaker.sh
      reseed: true
    secrets: inherit

  gamelift:
    concurrency:
      group: publish-gamelift
      cancel-in-progress: false
    uses: ./.github/workflows/publish-script.yml
    with:
      script: publish-gamelift.sh
      reseed: true
    secrets: inherit
